<html>
<head>
  <meta charset="UTF-8">
  <title>自分の名前</title>
  <style>
  body {
    margin: 0;
    background-color: #f3f4f6; /* 背景を少し暗くしてカレンダーを目立たせる */
    display: flex;             /* 中央揃えにするための魔法のコード */
    justify-content: center;   /* 左右のど真ん中 */
    align-items: center;       /* 上下のど真ん中 */
    min-height: 100vh;         /* 画面全体の高さを確保 */
  }
  iframe {
    width: 1000px;             /* 横幅を1000pxでガッチリ固定（伸びない） */
    height: 600px;             /* 高さを固定 */
    border: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* カレンダーの周りに少し影をつける */
  }
</style>

  <!-- ここから追加 -->
  <meta property="og:title" content="Bone Voyage 運営日程">
  <meta property="og:site_name" content="スケジュールのサイト名">
  <meta property="og:description" content="今後の予定やイベントの参加スケジュールはこちらのカレンダーから確認できます。">
  <!--<meta property="og:image" content="https://image.thum.io/get/https://haru827.github.io/Bone-Voyage_calendar/">-->

  <meta property="og:url" content="https://haru827.github.io/Bone-Voyage_calendar/">
  <meta name="twitter:card" content="summary_large_image">
 
</head>
<body>

</body>
</html>
